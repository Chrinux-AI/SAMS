<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | SAMS Academic Sentinel</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#1A237E",
              "on-primary": "#FFFFFF",
              "background": "#F5F7FA",
              "surface": "#FFFFFF",
              "on-surface": "#1C1B1F",
              "on-surface-variant": "#44474E",
              "outline": "#74777F",
              "outline-variant": "#C4C6D0",
              "secondary-container": "#E8DEF8",
            },
            fontFamily: {
              "body": ["Inter", "sans-serif"],
            },
            borderRadius: {
              "DEFAULT": "0.375rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
            },
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background font-body text-on-surface min-h-screen flex flex-col items-center justify-center p-4">
<main class="w-full max-w-[400px]">
<!-- Institutional Logo Section -->
<div class="flex flex-col items-center mb-8 text-center">
<div class="bg-primary text-on-primary p-3 rounded-xl mb-4 shadow-sm">
<span class="material-symbols-outlined text-4xl block" data-icon="school">school</span>
</div>
<h1 class="text-3xl font-bold tracking-tight text-primary">SAMS</h1>
<p class="text-xs font-semibold text-on-surface-variant uppercase tracking-widest mt-1">Academic Sentinel</p>
</div>
<!-- Login Card -->
<div class="bg-surface border border-outline-variant rounded-xl shadow-sm p-8">
<header class="mb-8">
<h2 class="text-2xl font-semibold text-on-surface">Welcome back</h2>
<p class="text-on-surface-variant text-sm mt-1">Please enter your institutional credentials</p>
</header>
<form class="space-y-5">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant" for="email">Email Address</label>
<input class="w-full px-4 py-2.5 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary text-on-surface text-sm transition-all outline-none" id="email" name="email" placeholder="admin@sams.edu" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant" for="password">Password</label>
<a class="text-xs text-primary font-semibold hover:underline" href="#">Forgot password?</a>
</div>
<input class="w-full px-4 py-2.5 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary text-on-surface text-sm transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary py-3 rounded-lg font-bold text-sm shadow-sm hover:bg-opacity-90 transition-colors mt-2" type="submit">
                Sign In
            </button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<span class="w-full border-t border-outline-variant"></span>
</div>
<div class="relative flex justify-center text-xs">
<span class="bg-surface px-4 text-on-surface-variant font-medium">Institutional SSO</span>
</div>
</div>
<!-- Google Workspace Provider -->
<button class="w-full flex items-center justify-center gap-3 px-4 py-2.5 border border-outline-variant rounded-lg text-on-surface-variant text-sm font-semibold hover:bg-background transition-colors">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Sign in with Google Workspace
        </button>
<!-- Institutional Register -->
<footer class="mt-8 pt-6 border-t border-outline-variant text-center">
<p class="text-on-surface-variant text-sm">
                New institution? 
                <a class="text-primary font-bold hover:underline ml-1" href="#">Register Now</a>
</p>
</footer>
</div>
<!-- System Status -->
<div class="mt-6 flex justify-between items-center px-2">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-green-600"></span>
<span class="text-[11px] font-semibold text-on-surface-variant uppercase tracking-tight">System Normal</span>
</div>
<div class="flex gap-4">
<a class="text-[11px] font-semibold text-on-surface-variant uppercase hover:text-primary" href="#">Support</a>
<a class="text-[11px] font-semibold text-on-surface-variant uppercase hover:text-primary" href="#">Privacy</a>
</div>
</div>
</main>
<footer class="mt-12 text-center">
<p class="text-[11px] font-medium tracking-wide text-on-surface-variant opacity-70">
        © 2024 SAMS Academic Sentinel • v2.0.4
    </p>
</footer>
</body></html>
