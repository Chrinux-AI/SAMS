<!-- Create shortcut icons for different sizes -->
<!-- These will be used by browsers and devices -->

<!-- SVG Favicon (Modern browsers) -->
<link rel="icon" type="image/svg+xml" href="/attendance/assets/images/icons/favicon.svg">

<!-- PNG Fallbacks (Older browsers) -->
<link rel="icon" type="image/png" sizes="16x16" href="/attendance/assets/images/icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/attendance/assets/images/icons/favicon-32x32.png">

<!-- Apple Touch Icons -->
<link rel="apple-touch-icon" href="/attendance/assets/images/icons/icon-192x192.png">
<link rel="apple-touch-icon" sizes="152x152" href="/attendance/assets/images/icons/icon-152x152.png">
<link rel="apple-touch-icon" sizes="180x180" href="/attendance/assets/images/icons/icon-192x192.png">
<link rel="apple-touch-icon" sizes="192x192" href="/attendance/assets/images/icons/icon-192x192.png">

<!-- PWA Manifest -->
<link rel="manifest" href="/attendance/manifest.json">

<!-- Theme Colors -->
<meta name="theme-color" content="#4F46E5">
<meta name="msapplication-TileColor" content="#4F46E5">
<meta name="msapplication-config" content="/attendance/browserconfig.xml">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="http://localhost:8000/attendance/">
<meta property="og:title" content="SAMS - Attendance Management">
<meta property="og:description" content="Student Attendance Management System - Track attendance, grades, and stay connected with your school community">
<meta property="og:image" content="http://localhost:8000/attendance/assets/images/icons/icon-512x512.png">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="http://localhost:8000/attendance/">
<meta property="twitter:title" content="SAMS - Attendance Management">
<meta property="twitter:description" content="Student Attendance Management System - Track attendance, grades, and stay connected with your school community">
<meta property="twitter:image" content="http://localhost:8000/attendance/assets/images/icons/icon-512x512.png">
