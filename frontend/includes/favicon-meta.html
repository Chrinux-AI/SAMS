<!-- Favicon: Light and Dark Mode -->
<!-- Uses existing logo files with theme system -->

<link
  rel="icon"
  type="image/png"
  href="/attendance/assets/images/icons/logo3.png"
/>
<link
  rel="icon"
  media="(prefers-color-scheme: dark)"
  type="image/png"
  href="/attendance/assets/images/icons/logo2.png"
/>
<link rel="shortcut icon" href="/attendance/assets/images/icons/logo3.png" />

<!-- Apple Touch Icons -->
<link rel="apple-touch-icon" href="/attendance/assets/images/icons/logo3.png" />
<link
  rel="apple-touch-icon"
  sizes="152x152"
  href="/attendance/assets/images/icons/logo3.png"
/>
<link
  rel="apple-touch-icon"
  sizes="180x180"
  href="/attendance/assets/images/icons/logo3.png"
/>
<link
  rel="apple-touch-icon"
  sizes="192x192"
  href="/attendance/assets/images/icons/logo3.png"
/>

<!-- PWA Manifest -->
<link rel="manifest" href="/attendance/manifest.json" />

<!-- Theme Colors -->
<meta name="theme-color" content="#4F46E5" />
<meta name="msapplication-TileColor" content="#4F46E5" />
<meta name="msapplication-config" content="/attendance/browserconfig.xml" />

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website" />
<meta property="og:url" content="http://localhost:8000/attendance/" />
<meta property="og:title" content="SAMS - Attendance Management" />
<meta
  property="og:description"
  content="Student Attendance Management System - Track attendance, grades, and stay connected with your school community"
/>
<meta
  property="og:image"
  content="http://localhost:8000/attendance/assets/images/icons/logo3.png"
/>

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image" />
<meta property="twitter:url" content="http://localhost:8000/attendance/" />
<meta property="twitter:title" content="SAMS - Attendance Management" />
<meta
  property="twitter:description"
  content="Student Attendance Management System - Track attendance, grades, and stay connected with your school community"
/>
<meta
  property="twitter:image"
  content="http://localhost:8000/attendance/assets/images/icons/logo3.png"
/>
