<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5E7EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>
  
  <!-- Graduation Cap -->
  <g transform="translate(16, 16)">
    <!-- Cap Base -->
    <path d="M-10 2 L0 -2 L10 2 L0 6 Z" fill="url(#cap)" opacity="0.95"/>
    
    <!-- Cap Top -->
    <path d="M-10 2 L0 6 L10 2 L0 10 Z" fill="url(#cap)" opacity="0.9"/>
    
    <!-- Tassel -->
    <line x1="0" y1="10" x2="0" y2="14" stroke="#FCD34D" stroke-width="1.5"/>
    <circle cx="0" cy="14.5" r="1.2" fill="#FCD34D"/>
    
    <!-- Book Icon -->
    <rect x="-6" y="7" width="12" height="8" rx="0.5" fill="#FFFFFF" opacity="0.9"/>
    <line x1="-4" y1="9.5" x2="4" y2="9.5" stroke="#4F46E5" stroke-width="0.8"/>
    <line x1="-4" y1="11.5" x2="2" y2="11.5" stroke="#4F46E5" stroke-width="0.8"/>
  </g>
  
  <!-- Subtle Glow Effect -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
</svg>
