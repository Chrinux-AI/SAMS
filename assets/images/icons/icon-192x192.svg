    <circle cx="0" cy="87" r="7" fill="#FCD34D"/>
    
    <!-- Book -->
    <rect x="-36" y="42" width="72" height="48" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <line x1="-24" y1="57" x2="24" y2="57" stroke="#4F46E5" stroke-width="3"/>
    <line x1="-24" y1="69" x2="12" y2="69" stroke="#4F46E5" stroke-width="3"/>
    <line x1="-24" y1="81" x2="18" y2="81" stroke="#4F46E5" stroke-width="3"/>
